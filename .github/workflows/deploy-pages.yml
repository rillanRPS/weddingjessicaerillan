name: Deploy wedding site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ".output/public/index.html" ]; then
            site_dir=".output/public"
          elif [ -f "dist/index.html" ]; then
            site_dir="dist"
          else
            echo "No static index.html was produced by the build."
            find . -maxdepth 3 -type f -name "index.html" -print
            exit 1
          fi
          mkdir -p _site
          cp -R "$site_dir"/. _site/
          touch _site/.nojekyll

      - name: Normalize GitHub Pages asset paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          prefix = "/weddingjessicaerillan"
          for path in Path("_site").rglob("*"):
              if path.suffix not in {".html", ".js", ".css"}:
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace('"/assets/', f'"{prefix}/assets/')
              text = text.replace("'/assets/", f"'{prefix}/assets/")
              text = text.replace("(/assets/", f"({prefix}/assets/")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
